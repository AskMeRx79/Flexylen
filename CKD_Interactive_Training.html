      title: "1. eGFR and urine ACR: getting the numbers right",
      html: `<p>CKD is defined as abnormalities of kidney structure or function <strong>present for more than 3 months</strong> with implications for health. In practice it is diagnosed on an eGFR &lt;60 mL/min/1.73m², an ACR ≥3 mg/mmol, or other markers of kidney damage (e.g. persistent haematuria after urological causes are excluded, structural abnormality on imaging).</p>
<ul>
<li><strong>eGFR</strong>: UK laboratories report the CKD-EPI creatinine equation. NICE NG203 advises <strong>not</strong> using an ethnicity adjustment.</li>
<li>A single low eGFR is not a diagnosis. If eGFR is newly &lt;60, <strong>repeat within 2 weeks</strong> to exclude AKI, then confirm chronicity with a repeat result over a period of at least 3 months.</li>
<li><strong>Urine ACR</strong> is the preferred test for proteinuria (more sensitive than PCR at low levels). Use an early morning sample where possible. If the initial ACR is 3–70 mg/mmol, confirm with an early morning sample; an ACR ≥70 mg/mmol does not need repeating to confirm.</li>
</ul>
<div class="callout key"><strong>When eGFR is unreliable</strong>: extremes of muscle mass (amputees, bodybuilders, frailty/sarcopenia), large recent meat intake (advise avoiding meat for 12 hours before the test), pregnancy, AKI (eGFR assumes steady state), and some drugs that block creatinine secretion (e.g. trimethoprim). NG203 suggests considering <strong>cystatin C-based eGFR</strong> at initial diagnosis where eGFR is 45–59 for at least 90 days with an ACR &lt;3, to confirm or rule out CKD.</div>
