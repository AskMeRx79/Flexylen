<li><strong>Act on CK:</strong></li></ol>

<p><strong>Make a clinical diagnosis</strong> with the <strong>Simon Broome</strong> criteria or the <strong>Dutch Lipid Clinic Network (DLCN)</strong> score (NICE suggests DLCN in primary care where available):</p>
