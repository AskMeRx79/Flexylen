      title: "1. Diagnosis: history, NT-proBNP and referral urgency",
      html: `<p>Heart failure (HF) is a clinical syndrome: symptoms (breathlessness, orthopnoea, paroxysmal nocturnal dyspnoea, fatigue, reduced exercise tolerance, ankle swelling) and signs (raised JVP, oedema, crackles, third heart sound, displaced apex) caused by structural or functional cardiac abnormality.</p>
<p>In suspected HF, take a careful history and examination, and measure <strong>NT-proBNP</strong>. Alongside it, arrange a 12-lead ECG and baseline bloods (U&amp;E/eGFR, FBC, LFT, TFT, HbA1c, lipids, ferritin and transferrin saturation) and consider a chest X-ray, urinalysis and spirometry/peak flow to look for alternative or contributing diagnoses.</p>
<table>
<tr><th>NT-proBNP (ng/L)</th><th>NICE NG106 action</th></tr>
<tr><td>&gt; 2,000</td><td>Refer urgently for specialist assessment and transthoracic echocardiography <strong>within 2 weeks</strong></td></tr>
<tr><td>400–2,000</td><td>Refer for specialist assessment and echocardiography <strong>within 6 weeks</strong></td></tr>
<tr><td>&lt; 400</td><td>HF less likely in an untreated person — consider alternative causes; reconsider if clinical suspicion remains high</td></tr>
</table>
<div class="callout key"><strong>Interpreting NT-proBNP:</strong> levels are <strong>lowered</strong> by obesity (BMI over 35), and by diuretics, ACE inhibitors, ARBs, beta-blockers and MRAs. Levels are <strong>raised</strong> by age over 70, AF, CKD (eGFR under 60), LVH, ischaemia, pulmonary hypertension, PE, sepsis, COPD and diabetes. A "normal" result in an obese patient on treatment does not fully exclude HF. Note that sacubitril/valsartan raises BNP (not NT-proBNP), so NT-proBNP is the preferred marker in patients taking it.</div>
<div class="callout red"><strong>Do not wait for the blood test</strong> if the patient is acutely unwell: breathless at rest, hypoxic, hypotensive, confused, or with chest pain or arrhythmia — arrange same-day emergency assessment.</div>`

<ul>
<li>Non-adherence (medicines, salt or fluid), new drugs (NSAIDs, steroids, non-dihydropyridine CCBs, pioglitazone).</li>
<li>Arrhythmia — especially new or fast AF (check pulse and ECG).</li>
<li>Infection (chest, urinary), anaemia, thyroid disease, uncontrolled hypertension, ischaemia/ACS, worsening renal function, alcohol.</li>
</ul>
<div class="callout red"><strong>Same-day emergency admission / 999:</strong> breathlessness at rest or unable to lie flat; SpO<sub>2</sub> below 92% (or below the patient's known baseline); respiratory rate above about 25–30/min; chest pain suggesting ACS; syncope; symptomatic hypotension or shock (systolic BP below 90 mmHg with poor perfusion); new confusion; HR above about 120–130 bpm or below 40 bpm; K<sup>+</sup> ≥ 6.5 mmol/L or severe AKI; rapidly worsening symptoms despite increased diuretic. Use clinical judgement and NEWS2.</div>
<p>Stable patients with mild-to-moderate fluid overload can often be managed in the community: increase the loop diuretic, check U&amp;E within a few days, daily weights, early review (2–3 days) and involve the HF nurse team.</p>

<li><strong>Cardiac rehabilitation:</strong> NICE NG106 recommends offering a personalised, exercise-based cardiac rehabilitation programme to people with stable HF (unless their condition is unstable), with psychological and educational components.</li>

<li><strong>Self-management:</strong> written plan covering daily weights, symptoms to act on, medicines, sick day guidance, salt, alcohol, smoking cessation, activity and sexual health.</li>
<li><strong>Mood and cognition:</strong> screen for depression and anxiety; consider cognitive impairment affecting adherence.</li>
<li><strong>Driving and work:</strong> advise patients to check current DVLA guidance, which depends on symptoms, licence group and devices.</li>
